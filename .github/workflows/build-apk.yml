name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds our own files. This adds the standard Android
      # project files Flutter needs, without overwriting ours.
      - name: Add missing Flutter platform files
        run: flutter create --org com.formsaathi --project-name form_saathi --platforms android .

      - run: flutter pub get

      # Errors are also printed as GitHub annotations so they can be read
      # from the API without downloading the full log.
      - name: Check code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "^ *error" analyze.txt | head -40 | while read -r line; do echo "::error title=analyze::$line"; done
          if grep -qE "^ *error" analyze.txt; then exit 1; fi

      - name: Run tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.txt || {
            grep -E "Error:|Expected|Actual|Reason|\.dart:[0-9]+" test.txt | head -40 | while read -r line; do echo "::error title=test::$line"; done
            exit 1
          }

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FormSaathi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FormSaathi-apk
          path: FormSaathi.apk

      # Puts the APK on the repo's Releases page so it can be downloaded
      # straight onto a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Form Saathi test build ${{ github.run_number }}
          body: Test build. Download FormSaathi.apk on your Android phone and tap it to install.
          files: FormSaathi.apk
          prerelease: true
