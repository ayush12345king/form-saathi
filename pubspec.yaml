name: form_saathi
description: "Form Saathi - get your government paperwork right the first time."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2        # pick a photo from gallery or camera
  image: ^4.2.0               # resize, crop and compress images (pure Dart)
  path_provider: ^2.1.4       # temporary folder for saving files
  shared_preferences: ^2.3.2  # stores your documents list on the phone
  gal: ^2.3.0                 # saves images to the phone gallery
  share_plus: ^10.1.4         # share sheet (WhatsApp, Drive, etc.)
  url_launcher: ^6.3.1        # opens official websites and Google Calendar
  flutter_local_notifications: 17.2.4  # expiry notifications (API pinned)
  timezone: ^0.9.4            # schedule notifications in Indian time

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1B2340"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
